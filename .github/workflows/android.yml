name: Android CI

on:
  push:
    branches: [feature/webextensions-runtime]
  pull_request:
    branches: [feature/webextensions-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check retained browser bridge
        run: node --test tests/bridge.test.mjs
      - name: Check and build
        run: ./gradlew --no-daemon :extension-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :ipc-probe:assembleDebug
      - name: Verify modern Xposed APKs
        run: |
          python3 tools/check-xposed-apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 tools/check-xposed-apk.py --forbid-diagnostics app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            extension-core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-Extensions-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-Extensions-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
