name: Android CI

on:
  push:
    branches: [feature/webextensions-runtime]
  pull_request:
    branches: [feature/webextensions-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check retained browser bridge
        run: node --test tests/bridge.test.mjs
      - name: Check and build
        run: ./gradlew --no-daemon :extension-core:test :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            extension-core/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-Extensions-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-Extensions-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
